{%- comment -%}
Overrides minima's default layout to add a body class on pages that opt into a
pinned (sticky) header via front matter: sticky_header: true.
{%- endcomment -%}
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

{%- include head.html -%}

<body{% if page.sticky_header %} class="sticky-header"{% endif %}>

  {%- include header.html -%}

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  {%- include footer.html -%}

</body>

</html>
