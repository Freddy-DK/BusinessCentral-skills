title: Business Central Skills
description: A collection of skills for Microsoft Dynamics 365 Business Central.
author: Freddy Kristiansen
theme: minima

# Served at the apex custom domain (see CNAME), so the site lives at the root.
url: "https://businesscentral-skills.com"
baseurl: ""

# Repo and sponsor links used by the custom header (_includes/header.html).
github_repo: https://github.com/Freddy-DK/BusinessCentral-skills
sponsor_url: https://github.com/sponsors/Freddy-DK

# index.md is generated in CI by scripts/Build-SkillIndex.ps1. Each skill's own
# README.md gets Jekyll front matter injected in place and is served at its
# permalink (/skills/<name>/), so no page copies exist.
exclude:
  - README.md
  - "**/SKILL.md"
  - "**/skill.json"
  - "**/scripts"
  - "**/*.ps1"
  - ".github"
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
